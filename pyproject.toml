[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-remap"
version = "0.1.0"
description = "Critical-path-based physically aware remapping for post-layout timing optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "CPA-remap contributors" }
]
dependencies = []

[project.scripts]
cpa-remap = "cpa_remap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
